<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      color: #222;
      font-size: 24px;
    }

    p {
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Welcome</h1>
    <p>This page is working perfectly without ads.</p>
  </div>
</body>
</html>
